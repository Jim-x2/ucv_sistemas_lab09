[project]
name = "travel-adk-multiagent"
version = "0.1.0"
description = "Sistema multiagente de planificación de viajes con Google ADK"
authors = [
    {name = "Jimmy Chamorro Ayala",email = "TU_CORREO@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk (>=2.13.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
[tool.poetry]
packages = [{ include = "travel_assistant" }]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=travel_assistant --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []